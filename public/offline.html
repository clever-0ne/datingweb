<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Tesla Capital</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0e18;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; color: #fff; }
      p { margin: 0 0 20px; font-size: 14px; color: #94a3b8; line-height: 1.6; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #2f6dff, #0a54ff);
        cursor: pointer;
      }
      /* The mark is drawn inline rather than pointed at a file. This page is
         only ever seen when the network is gone, so an <img> would be the one
         request guaranteed to fail. */
      .mark { display: block; margin: 0 auto 14px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" width="50" height="48" viewBox="0 0 278.672 265" role="img"
           aria-label="Tesla Capital">
        <g fill="#e82127">
          <path transform="translate(-33.796,-64.797)" d="m173.146 317.299 35.476-199.519c33.815 0 44.481 3.708 46.021 18.843 0 0 22.684-8.458 34.125-25.636-44.646-20.688-89.505-21.621-89.505-21.621l-26.176 31.882 0.059-4e-3 -26.176-31.883s-44.86 0.934-89.5 21.622c11.431 17.178 34.124 25.636 34.124 25.636 1.549-15.136 12.202-18.844 45.79-18.868l35.762 199.548"/>
          <path transform="translate(-33.796,-64.797)" d="m173.132 80.157c36.09-0.276 77.399 5.583 119.687 24.014 5.652-10.173 7.105-14.669 7.105-14.669-46.227-18.289-89.518-24.548-126.797-24.705-37.277 0.157-80.566 6.417-126.787 24.705 0 0 2.062 5.538 7.1 14.669 42.28-18.431 83.596-24.29 119.687-24.014h5e-3"/>
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        Tesla Capital needs a connection to show live balances and prices.<br />
        Check your network and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
