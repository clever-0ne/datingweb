<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Tesla Capital</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0e18;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; color: #fff; }
      p { margin: 0 0 20px; font-size: 14px; color: #94a3b8; line-height: 1.6; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #2f6dff, #0a54ff);
        cursor: pointer;
      }
      .mark { font-size: 40px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">⚡</div>
      <h1>You're offline</h1>
      <p>
        Tesla Capital needs a connection to show live balances and prices.<br />
        Check your network and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
